[package]
name = "bibrs"
version = "0.2.0"
edition = "2024"
description = "CLI tool for parsing BibTeX/BibLaTeX files"

[dependencies]
biblatex = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
shellexpand = "3.1.1"
shell-words = "1.1.1"
